services:
  - type: web
    name: pautalimpa
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --graceful-timeout 120 --keep-alive 5 --log-file -
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: UI_POSTS_LIMIT
        value: "500"
